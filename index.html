<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Platform Train</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #9cc4e4; font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; user-select: none; }
  canvas { display: block; }

  #bubble { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.94); border-radius: 26px;
    padding: 10px 22px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.2);
    font-size: clamp(18px, 4vw, 28px); color: #333; max-width: calc(100vw - 120px); white-space: nowrap; }
  #bubble .num { display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; border-radius: 14px; color: #fff;
    font-size: 1.5em; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #bubble.pop { animation: pop .4s; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.12); } 100% { transform: translateX(-50%) scale(1); } }

  #stars { position: fixed; top: 16px; right: 16px; background: rgba(255,255,255,.94); border-radius: 20px; padding: 8px 14px; font-size: 22px; color: #333;
    box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  #mute { position: fixed; top: 16px; left: 16px; width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(255,255,255,.94);
    font-size: 22px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.12); }

  #pad { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; width: max-content; max-width: calc(100vw - 32px); transition: opacity .4s; }
  #pad button { width: clamp(52px, 8vw, 76px); height: clamp(52px, 8vw, 76px); border-radius: 20px; border: none; color: #fff; cursor: pointer;
    font: inherit; font-size: clamp(28px, 4.6vw, 42px); text-shadow: 0 2px 0 rgba(0,0,0,.3); box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.25);
    transition: transform .08s, box-shadow .08s, opacity .2s; }
  #pad button:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  #pad.off button { opacity: .45; pointer-events: none; }
  #pad button.shake { animation: shake .45s; }
  #pad button.hint { animation: hint 1s infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes hint { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 0 6px #fff, 0 6px 0 rgba(0,0,0,.25); } }
  @media (max-width: 600px) { #pad { max-width: 330px; } }
  body.journey #pad { opacity: 0; pointer-events: none; }

  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 60, 100, .4); backdrop-filter: blur(5px); z-index: 10; }
  #start .card { background: #fff; border-radius: 32px; padding: 32px 36px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.15); max-width: calc(100vw - 32px); }
  #start h1 { font-size: clamp(28px, 6vw, 44px); color: #d32f2f; margin-bottom: 8px; }
  #start p { font-size: 18px; color: #555; margin-bottom: 22px; line-height: 1.4; }
  #start button { font: inherit; font-size: 30px; padding: 14px 44px; border: none; border-radius: 24px; background: #43a047; color: #fff;
    cursor: pointer; box-shadow: 0 6px 0 #2e7d32; }
  #start button:active { transform: translateY(4px); box-shadow: 0 2px 0 #2e7d32; }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .55s; z-index: 5; }
  #card { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.5); font-size: clamp(34px, 7vw, 76px); color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.25), 0 8px 30px rgba(0,0,0,.35); opacity: 0; pointer-events: none; white-space: nowrap; z-index: 4;
    transition: opacity .4s, transform .6s cubic-bezier(.2, 1.6, .4, 1); }
  #card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
  <div id="bubble">🚆 <span id="say">Get ready…</span> <span class="num" id="bnum">?</span></div>
  <div id="stars">⭐ <span id="starCount">0</span></div>
  <button id="mute" aria-label="Sound on/off">🔊</button>
  <div id="pad" class="off"></div>
  <div id="card"></div>
  <div id="fade"></div>
  <div id="start"><div class="card">
    <h1>🚆 Platform Train</h1>
    <p>Every platform has its own train.<br>Listen for the number, tap the right number,<br>train or platform sign — then ride along!</p>
    <button id="play">▶ Play</button>
  </div></div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { Water } from 'three/addons/objects/Water.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ================= layout =================
    // Trains wait by the tunnel portals (far, +z) and drive toward the camera (-z) into the platforms.
    const N = 9, SP = 5;
    const xOf = i => (4 - i) * SP;                 // platform 1 on the left of the screen
    const COLORS = ['#e53935', '#fb8c00', '#f2b705', '#43a047', '#00897b', '#1e88e5', '#5e35b1', '#d81b60', '#6d4c41']; // number colours
    const Z_START = 41, Z_END = -17, L = Z_START - Z_END;
    const RAIL_TOP = 0.5, PLAT_H = 1.3, WHEEL_R = .42;
    const CAR_GAP = 6;
    const S0 = 16, S_END = 52.5;                   // engine centre z = Z_START - s  (25 waiting, -11.5 at platform)
    const P_Z0 = 3.6, P_Z1 = -16;
    const WW = N * SP / 2 + 6;                     // half width of the tunnel wall

    // ================= renderer + post-processing =================
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.62;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog('#d4e4f1', 150, 560);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 6000);

    const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }));
    const renderPass = new RenderPass(scene, camera);
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .4, .6, 3.0);
    composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(new OutputPass());
    composer.setSize(innerWidth, innerHeight);

    // ================= helpers =================
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;
    const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
    const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...o });
    const toy = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: .45, metalness: 0, clearcoat: .4, clearcoatRoughness: .3, ...o });
    function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
      parent.add(m); return m;
    }
    function grp(parent, x, y, z, s = 1, ry = rnd(0, 6.283)) {
      const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); g.rotation.y = ry; parent.add(g); return g;
    }
    function canvasTex(w, h, draw, rx = 1, ry = 1, srgb = true) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
      return t;
    }
    function speckle(ctx, w, h, base, cols, count, maxSize) {
      ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
      for (let k = 0; k < count; k++) {
        ctx.fillStyle = cols[k % cols.length]; ctx.globalAlpha = rnd(.25, .8);
        const s = rnd(1, maxSize); ctx.fillRect(rnd(0, w), rnd(0, h), s, s * rnd(.6, 1.4));
      }
      ctx.globalAlpha = 1;
    }
    function drawNumber(ctx, w, h, n, color) {
      ctx.fillStyle = '#18202b'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#d0d0d0'; ctx.beginPath(); ctx.roundRect(10, 10, w - 20, h - 20, 30); ctx.fill();
      ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(20, 20, w - 40, h - 40, 22); ctx.fill();
      ctx.font = `bold ${h * .72}px "Arial Rounded MT Bold", Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.strokeText(n, w / 2, h / 2 + 8);
      ctx.fillStyle = '#fff'; ctx.fillText(n, w / 2, h / 2 + 8);
    }
    // ---- noise ----
    function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
    function vnoise(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
    }
    function fbm(x, y, oct = 4) { let a = .5, f = 1, s = 0, n = 0; for (let k = 0; k < oct; k++) { s += a * vnoise(x * f, y * f); n += a; a *= .5; f *= 2; } return s / n; }
    function ridged(x, y) { let a = .5, f = 1, s = 0, n = 0; for (let k = 0; k < 4; k++) { s += a * (1 - Math.abs(vnoise(x * f, y * f) * 2 - 1)); n += a; a *= .5; f *= 2.1; } return s / n; }
    function ramp(stops) {
      const cs = stops.map(([h, c]) => [h, new THREE.Color(c)]);
      return (out, h) => {
        if (h <= cs[0][0]) return out.copy(cs[0][1]);
        for (let k = 1; k < cs.length; k++) if (h <= cs[k][0]) return out.copy(cs[k - 1][1]).lerp(cs[k][1], (h - cs[k - 1][0]) / (cs[k][0] - cs[k - 1][0]));
        return out.copy(cs[cs.length - 1][1]);
      };
    }

    // ================= textures =================
    const detailTex = canvasTex(512, 512, (c, w, h) => speckle(c, w, h, '#e6e6e6', ['#ffffff', '#cfcfcf', '#f3f3f3', '#bdbdbd', '#dadada'], 16000, 3));
    const gravelTex = canvasTex(256, 256, (c, w, h) => speckle(c, w, h, '#857d73', ['#6a635b', '#a39b90', '#8f8273', '#57514b', '#b5ada2'], 7000, 4), .9, .9);
    const concreteTex = canvasTex(256, 256, (c, w, h) => {
      speckle(c, w, h, '#b9b6b0', ['#aaa7a1', '#c7c4be', '#a09d97'], 4000, 3);
      c.strokeStyle = 'rgba(80,80,80,.35)'; c.lineWidth = 2; c.strokeRect(0, 0, w, h);
    }, .4, .4);
    const brickTex = canvasTex(512, 512, (c, w, h) => {
      c.fillStyle = '#cfc6ba'; c.fillRect(0, 0, w, h);
      const bh = 32, bw = 64;
      for (let r = 0; r < h / bh; r++) for (let q = -1; q < w / bw + 1; q++) {
        const x = q * bw + (r % 2 ? bw / 2 : 0);
        c.fillStyle = `hsl(${rnd(8, 18)}, 45%, ${rnd(30, 42)}%)`; c.fillRect(x + 3, r * bh + 3, bw - 6, bh - 6);
      }
    }, 3, 1.2);
    const stoneTex = canvasTex(512, 512, (c, w, h) => {
      c.fillStyle = '#6b665e'; c.fillRect(0, 0, w, h);
      const bh = 64, bw = 128;
      for (let r = 0; r < h / bh; r++) for (let q = -1; q < w / bw + 1; q++) {
        const x = q * bw + (r % 2 ? bw / 2 : 0), l = rnd(52, 66);
        c.fillStyle = `hsl(${rnd(28, 40)}, 9%, ${l}%)`; c.fillRect(x + 3, r * bh + 3, bw - 6, bh - 6);
        for (let k = 0; k < 40; k++) { c.fillStyle = `hsla(30, 8%, ${l + rnd(-12, 12)}%, .5)`; c.fillRect(x + rnd(4, bw - 10), r * bh + rnd(4, bh - 10), rnd(2, 9), rnd(2, 6)); }
      }
    }, .22, .22);
    const cloudTex = canvasTex(512, 256, (c, w, h) => {
      for (let k = 0; k < 50; k++) {
        const x = w / 2 + (Math.random() + Math.random() - 1) * w * .36;
        const y = h * .6 - Math.random() * h * .32 * (1 - Math.abs(x - w / 2) / (w * .42)), r = rnd(26, 58);
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
      }
    });
    function glowTex(inner, outer) {
      return canvasTex(128, 128, c => {
        const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, inner); g.addColorStop(.35, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g; c.fillRect(0, 0, 128, 128);
      });
    }

    // ================= shared geometry: primitives, trees, rocks =================
    const GEO = {
      sph: new THREE.SphereGeometry(1, 20, 14), hemi: new THREE.SphereGeometry(1, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2),
      cyl: new THREE.CylinderGeometry(1, 1, 1, 16), cone: new THREE.ConeGeometry(1, 1, 16), cone4: new THREE.ConeGeometry(1, 1, 4),
      cone8: new THREE.ConeGeometry(1, 1, 9), box: new RoundedBoxGeometry(1, 1, 1, 2, .08), torus: new THREE.TorusGeometry(1, .14, 12, 40),
      wing: new THREE.CircleGeometry(.45, 12),
    };
    const TMC = {};
    const tm = c => TMC[c] || (TMC[c] = std(c, { roughness: .82 }));
    function P(g, geo, color, x, y, z, sx, sy = sx, sz = sx, mat) {
      const m = new THREE.Mesh(geo, mat || tm(color));
      m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = m.receiveShadow = true; g.add(m); return m;
    }
    function blobGeo(seed) {
      let g = new THREE.IcosahedronGeometry(1, 2); g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
      const p = g.attributes.position, col = new Float32Array(p.count * 3);
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        const k = .74 + .55 * fbm(x * 1.7 + seed * 7.3, (y + z * .7) * 1.7 + seed * 3.1, 3);
        p.setXYZ(i, x * k, y * k * .9, z * k);
        const sh = .45 + .65 * sstep(-1, .9, y); col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = sh;
      }
      g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals(); return g;
    }
    const BLOBS = [blobGeo(1), blobGeo(2), blobGeo(3), blobGeo(4)];
    const ROCK_GEO = (() => {
      const g = new THREE.IcosahedronGeometry(1, 1), p = g.attributes.position;
      for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = .7 + .6 * vnoise(x * 2 + 5, y * 2 + z * 2); p.setXYZ(i, x * k, y * k * .7, z * k); }
      g.computeVertexNormals(); return g;
    })();
    const LMC = {};
    const leafMat = c => LMC[c] || (LMC[c] = std(c, { vertexColors: true, roughness: .92 }));
    const GREENS = ['#4c8a36', '#5a9a3e', '#3f7a30', '#68a548'], DARKS = ['#2c6a2a', '#357a30', '#27602a'], PINES = ['#2b5e33', '#2f6a38', '#255430'];
    const BARK = std('#5f4634', { roughness: 1 }), PALM_BARK = std('#8a6f4d', { roughness: 1 });
    const TRUNK_GEO = new THREE.CylinderGeometry(.15, .3, 1, 8); TRUNK_GEO.translate(0, .5, 0);
    const PINE_GEO = new THREE.ConeGeometry(1, 1, 11);
    const FROND_GEO = (() => {
      const g = new THREE.PlaneGeometry(1, 1, 4, 10), p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const u = p.getX(i), t = p.getY(i) + .5, w = Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.04)), .7) * .55 + .03;
        p.setXYZ(i, u * 2 * w, .9 * t - 2.3 * t * t - Math.abs(u) * w * .9, 3.6 * t);
      }
      g.computeVertexNormals(); return g;
    })();
    const FROND_MAT = std('#3f9440', { side: THREE.DoubleSide, roughness: .7 });
    const ROCK_MAT = std('#8b8a86', { flatShading: true, roughness: .95 });
    const sh = m => { m.castShadow = m.receiveShadow = true; return m; };

    function broadleaf(parent, x, y, z, s, cols = GREENS) {
      const g = grp(parent, x, y, z, s);
      const t = sh(new THREE.Mesh(TRUNK_GEO, BARK)); t.scale.set(1, 2.8, 1); g.add(t);
      const n = 5 + (Math.random() * 3 | 0);
      for (let k = 0; k < n; k++) {
        const b = sh(new THREE.Mesh(pick(BLOBS), leafMat(pick(cols)))), a = rnd(0, 6.283), r = k ? rnd(.5, 1.25) : 0;
        b.position.set(Math.cos(a) * r, k ? rnd(2.8, 4.1) : 4.3, Math.sin(a) * r); b.scale.setScalar(rnd(.95, 1.45)); b.rotation.y = rnd(0, 6);
        g.add(b);
      }
      return g;
    }
    function pine(parent, x, y, z, s, snow) {
      const g = grp(parent, x, y, z, s), mat = tm(pick(PINES));
      const t = sh(new THREE.Mesh(TRUNK_GEO, BARK)); t.scale.set(.9, 1.7, .9); g.add(t);
      for (let q = 0; q < 5; q++) {
        const r = 1.75 - q * .31, yy = 1.7 + q * .95;
        const c = sh(new THREE.Mesh(PINE_GEO, mat)); c.position.y = yy; c.scale.set(r, 1.75, r); c.rotation.y = q; g.add(c);
        if (snow) { const w = sh(new THREE.Mesh(PINE_GEO, tm('#f6f9fc'))); w.position.y = yy + .42; w.scale.set(r * .66, 1.0, r * .66); g.add(w); }
      }
      return g;
    }
    function palm(parent, x, y, z, s) {
      const g = grp(parent, x, y, z, s); let px = 0; const lean = rnd(.1, .3);
      for (let q = 0; q < 8; q++) { const m = sh(new THREE.Mesh(GEO.cyl, PALM_BARK)); m.position.set(px, q * .72 + .36, 0); m.scale.set(.27 - q * .015, .78, .27 - q * .015); g.add(m); px += lean * q * .06; }
      for (let k = 0; k < 9; k++) {
        const pv = new THREE.Group(); pv.position.set(px, 5.75, 0); pv.rotation.y = k / 9 * 6.283 + rnd(-.2, .2); g.add(pv);
        const f = sh(new THREE.Mesh(FROND_GEO, FROND_MAT)); f.rotation.x = rnd(-.3, .15); f.scale.setScalar(rnd(.85, 1.15)); pv.add(f);
      }
      for (let k = 0; k < 3; k++) P(g, GEO.sph, '#5a4127', px + Math.cos(k * 2.1) * .28, 5.5, Math.sin(k * 2.1) * .28, .22);
      return g;
    }
    function rock(parent, x, y, z, s) { const m = sh(new THREE.Mesh(ROCK_GEO, ROCK_MAT)); m.position.set(x, y + s * .15, z); m.scale.set(s * rnd(.8, 1.3), s * rnd(.6, 1), s * rnd(.8, 1.3)); m.rotation.y = rnd(0, 6); parent.add(m); return m; }

    function buildTerrain(size, segs, hFn, cFn) {
      const g = new THREE.PlaneGeometry(size, size, segs, segs); g.rotateX(-Math.PI / 2);
      const p = g.attributes.position, uv = g.attributes.uv, col = new Float32Array(p.count * 3), c = new THREE.Color();
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), z = p.getZ(i), h = hFn(x, z);
        p.setY(i, h); cFn(c, h, x, z); c.multiplyScalar((.8 + .4 * fbm(x * .035 + 11, z * .035 + 3, 3)) * (.92 + .16 * vnoise(x * .3, z * .3)));
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        uv.setXY(i, x / 7, z / 7);
      }

    }

    // ---------- people ----------
    const SKIN = ['#ffdbb5', '#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffe0bd'].map(c => std(c, { roughness: .65 }));
    const HAIR = ['#2b1b0e', '#5a3825', '#e0b354', '#a0522d', '#1a1a1a', '#d35400', '#b0b0b0'].map(c => std(c, { roughness: .6 }));
    const SHIRT = ['#d84a47', '#3b8fd9', '#55a65a', '#e6b422', '#9a43ab', '#22a9bd', '#e8663c', '#d63a71'].map(c => std(c, { roughness: .85 }));
    const PANTS = ['#37474f', '#34408f', '#5d4037', '#455a64', '#2f5d57'].map(c => std(c, { roughness: .9 }));
    const HATS = ['#c62828', '#1565c0', '#f9a825', '#7b1fa2', '#2e7d32'].map(c => std(c, { roughness: .8 }));
    const PG = {
      head: new THREE.SphereGeometry(.3, 22, 16),

      leg: new THREE.CylinderGeometry(.1, .1, .56, 10),
      hat: new THREE.CylinderGeometry(.24, .3, .28, 16),

    };
    const blackMat = std('#1a1a1a', { roughness: .3 }), smileMat = std('#7a1f1f');
    function makePerson() {
      const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
      const skin = pick(SKIN), shirt = pick(SHIRT), pants = pick(PANTS);
      for (const x of [-.13, .13]) mesh(PG.leg, pants, x, .28, 0, body);

        mesh(PG.arm, shirt, 0, -.25, 0, pv);
        mesh(PG.eye, skin, 0, -.5, 0, pv, false).scale.setScalar(2);

      });
      mesh(PG.head, skin, 0, 1.68, 0, body);
      if (Math.random() < .3) { const hc = pick(HATS); mesh(PG.hat, hc, 0, 1.98, 0, body); mesh(PG.brim, hc, 0, 1.86, 0, body); }
      else mesh(PG.hair, pick(HAIR), 0, 1.72, .03, body, false);
      for (const x of [-.1, .1]) mesh(PG.eye, blackMat, x, 1.72, -.27, body, false);
      mesh(PG.smile, smileMat, 0, 1.6, -.275, body, false).rotation.z = Math.PI;
      if (Math.random() < .35) mesh(PG.case, pick(HATS), .48, .32, 0, body);
      g.scale.setScalar(Math.random() < .3 ? .72 : rnd(.92, 1.05));

    }
    // a face seen at a train window (x = local x of the glass)
    function windowFace(parent, x, y, z, visible) {
      const s = Math.sign(x);
      const g = new THREE.Group(); g.position.set(x + s * .02, y, z); parent.add(g);
      mesh(PG.wHead, pick(SKIN), 0, 0, 0, g, false).scale.set(.3, 1, 1);
      mesh(PG.wHair, pick(HAIR), 0, .05, 0, g, false).scale.set(.33, 1, 1);
      for (const dz of [-.1, .1]) mesh(PG.eye, blackMat, s * .08, .04, dz, g, false);
      mesh(PG.smile, smileMat, s * .085, -.08, 0, g, false).rotation.set(0, s * Math.PI / 2, Math.PI);
      g.visible = visible; return g;
    }

    function makeTrain(i) {
      const lv = liveryOf(i);
      const paint = new THREE.MeshPhysicalMaterial({ color: lv.body, metalness: .2, roughness: .3, clearcoat: .8, clearcoatRoughness: .2, envMapIntensity: .75 });
      const doorMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(lv.body).multiplyScalar(.72), metalness: .2, roughness: .32, clearcoat: 1 });
      const stripe = new THREE.MeshPhysicalMaterial({ color: lv.stripe, metalness: .1, roughness: .3, clearcoat: 1 });
      const lampMat = new THREE.MeshStandardMaterial({ color: '#fffbe8', emissive: '#fff2c4', emissiveIntensity: .8 });
      const wheels = [], cars = [], riders = [];
      // ---- driving car: nose and face at local +z ----
      const eng = new THREE.Group(), e = new THREE.Group(); eng.add(e);
      mesh(TG.engBody, paint, 0, 2.325, -1.0, e);
      mesh(TG.nose, paint, 0, .95, .98, e);
      mesh(new THREE.BoxGeometry(2.42, .78, 2.3), TM.glass, 0, 2.8, -1.6, e, false);
      sideDoor(e, .3, doorMat);
      mesh(new THREE.BoxGeometry(2.43, .13, 3.8), stripe, 0, 1.95, -1.0, e, false);
      mesh(TG.roofE, TM.roof, 0, 3.72, -1.1, e, false); mesh(TG.ac, TM.roof, 0, 3.84, -1.4, e);
      mesh(TG.plow, TM.dark, 0, .74, 2.25, e);
      mesh(TG.under, TM.dark, 0, .74, -.4, e);
      for (const x of [-.9, .9]) mesh(TG.lamp, lampMat, x, 1.28, 2.905, e, false).rotation.x = Math.PI / 2;
      for (const x of [-1.21, 1.21]) windowFace(e, x, 2.78, -.9, true);          // the driver
      // face: eyes on the windscreen, smile on the nose
      const th = Math.atan2(1.12, 1.67);
      const F = new THREE.Group(); F.position.set(0, 2.565 + Math.sin(th) * .03, 2.32 + Math.cos(th) * .03); F.rotation.x = -th; e.add(F);
      mesh(TG.shield, TM.glass, 0, 0, 0, F, false);
      const eyes = [];

        const g = new THREE.Group(); g.position.set(x, .02, .05); F.add(g);
        mesh(TG.eye, TM.white, 0, 0, 0, g, false).scale.set(.37, .46, .09);
        const p = mesh(TG.eye, TM.black, 0, -.04, .07, g, false); p.scale.set(.17, .215, .05);

      }
      const mouth = mesh(TG.mouth, TM.mouth, 0, 1.68, 2.9, e, false); mouth.rotation.z = Math.PI;
      for (const x of [-.62, .62]) mesh(TG.cheek, TM.cheek, x, 1.72, 2.905, e, false);
      bogie(e, -2.0, wheels); bogie(e, 1.3, wheels);
      cars.push(eng);

      for (let k = 0; k < 2; k++) {
        const c = new THREE.Group();
        mesh(TG.carBody, paint, 0, 2.325, 0, c);
        mesh(new THREE.BoxGeometry(2.42, .78, 2.5), TM.glass, 0, 2.8, 0, c, false);
        sideDoor(c, 1.95, doorMat); sideDoor(c, -1.95, doorMat);
        mesh(new THREE.BoxGeometry(2.43, .13, 5.4), stripe, 0, 1.95, 0, c, false);
        mesh(TG.roofC, TM.roof, 0, 3.72, 0, c, false);
        mesh(TG.ac, TM.roof, 0, 3.84, k ? 1.4 : -1.5, c);
        mesh(TG.under, TM.dark, 0, .74, 0, c);
        mesh(TG.gangway, TM.rubber, 0, 2.2, 2.95, c);
        for (const z of [-.8, 0, .8]) for (const x of [-1.21, 1.21]) riders.push(windowFace(c, x, 2.78, z, false));
        if (k === 0) {           // pantograph
          mesh(new THREE.BoxGeometry(.9, .08, 1.3), TM.dark, 0, 3.8, .9, c);
          mesh(new THREE.BoxGeometry(.06, .06, .8), TM.dark, 0, 4.0, .75, c).rotation.x = -.75;
          mesh(new THREE.BoxGeometry(.06, .06, .8), TM.dark, 0, 4.3, .75, c).rotation.x = .75;
          mesh(new THREE.BoxGeometry(1.4, .05, .22), TM.dark, 0, 4.47, .48, c);
        } else for (const x of [-.8, .8]) mesh(TG.lamp, TM.tail, x, 1.4, -2.86, c, false).rotation.x = Math.PI / 2;
        bogie(c, -1.8, wheels); bogie(c, 1.8, wheels);
        cars.push(c);
      }
      cars.forEach(c => { c.rotation.y = Math.PI; c.userData.idx = i; scene.add(c); });
      return { i, x: xOf(i), cars, e, wheels, riders, face: { eyes, mouth }, lampMat, s: S0, anim: null, wobble: 0, happy: 0, blinkT: rnd(1, 4), blink: 0 };
    }
    const trains = [];
    for (let i = 0; i < N; i++) trains.push(makeTrain(i));

    function placeTrain(tr, time, dt) {
      const moving = !!tr.anim && !(tr.anim.delay > 0);
      if (!tr.inJourney) tr.cars.forEach((c, k) => {
        c.position.set(tr.x, RAIL_TOP, Z_START - (tr.s - k * CAR_GAP));
        c.position.y += moving ? Math.sin(time * 21 + k * 1.3) * .008 : 0;
        c.rotation.z = moving ? Math.sin(time * 3 + k) * .006 : 0;
      });
      tr.e.rotation.y = Math.sin(tr.wobble * 28) * .07 * Math.min(1, tr.wobble * 3);
      // eyes: blink, happy squint, look around
      tr.blinkT -= dt;
      if (tr.blinkT <= 0) { tr.blink = .15; tr.blinkT = rnd(2, 5); }
      tr.blink = Math.max(0, tr.blink - dt);
      const lid = tr.blink > 0 ? .12 : tr.happy > 0 ? .4 : 1;
      tr.happy = Math.max(0, tr.happy - dt);
      const lx = tr.wobble > 0 ? Math.sin(time * 14) * .12 : Math.sin(time * .7 + tr.i * 1.7) * .07;
      tr.face.eyes.forEach(ey => { ey.g.scale.y += (lid - ey.g.scale.y) * Math.min(1, dt * 25); ey.pupil.position.x = lx; });
      tr.face.mouth.scale.set(tr.happy > 0 || moving ? 1.25 : 1, tr.wobble > 0 ? .45 : (tr.happy > 0 ? 1.4 : 1), 1);
    }

    // ---------- waiting passengers: each track has a little group on the platform beside it ----------
    const waiting = [];
    const PASS_Z = [-7, -4.6, -.6];
    function spawnPassengers(i) {
      (waiting[i] || []).forEach(w => scene.remove(w.g));
      const n = 2 + (Math.random() < .5 ? 1 : 0);
      waiting[i] = [];
      for (let k = 0; k < n; k++) {
        const w = makePerson();
        w.home = new THREE.Vector3(xOf(i) - 2.05 + rnd(-.2, .2), PLAT_H, PASS_Z[k] + rnd(-.3, .3));
        w.g.position.copy(w.home); w.g.rotation.y = rnd(-.5, .2);
        w.full = w.g.scale.x; w.g.scale.setScalar(.001); w.state = 'appear'; w.t = -k * .15;
        scene.add(w.g); waiting[i].push(w);
      }
    }
    for (let i = 0; i < N; i++) spawnPassengers(i);
    function boardPassengers(tr) {
      waiting[tr.i].forEach((w, k) => {
        w.state = 'walk'; w.t = -.3 - k * .45;
        const doors = [];
        for (const cz of [Z_START - S_END + CAR_GAP, Z_START - S_END + 2 * CAR_GAP]) doors.push(cz - 1.95, cz + 1.95);
        const dz = doors.reduce((a, b) => Math.abs(b - w.home.z) < Math.abs(a - w.home.z) ? b : a);
        w.door = new THREE.Vector3(tr.x - 1.4, PLAT_H, dz);
        w.from = w.g.position.clone();
      });
    }
    const tmpV = new THREE.Vector3();
    function revealRider(tr) {
      const r = tr.riders.find(r => !r.visible && r.getWorldPosition(tmpV).x < tr.x) || tr.riders.find(r => !r.visible);
      if (r) { r.visible = true; r.scale.setScalar(.01); }
    }
    function updatePassengers(dt, time) {
      for (let i = 0; i < N; i++) {
        const tr = trains[i], excited = state === 'go' && follow === tr;
        for (const w of waiting[i]) {
          const b = w.body, [la, ra] = w.arms;
          if (w.state === 'appear') {
            w.t += dt * 3; const k = clamp(w.t, 0, 1);
            w.g.scale.setScalar(Math.max(.001, w.full * (k < 1 ? 1 + Math.sin(k * Math.PI) * .25 : 1) * k));
            if (w.t >= 1) w.state = 'wait';
          } else if (w.state === 'wait') {
            if (excited) {
              b.position.y = Math.abs(Math.sin(time * 9 + w.seed)) * .3;
              la.rotation.z = -2.6 + Math.sin(time * 14 + w.seed) * .4; ra.rotation.z = 2.6 - Math.sin(time * 14 + w.seed) * .4;
            } else {
              b.position.y = Math.abs(Math.sin(time * 1.6 + w.seed)) * .02;
              const wave = Math.sin(time * .5 + w.seed) > .85;
              la.rotation.z = -.15; ra.rotation.z = wave ? 2.5 + Math.sin(time * 12) * .4 : .15;
            }
          } else if (w.state === 'walk') {
            w.t += dt / 1.0;
            if (w.t < 0) { b.position.y = Math.abs(Math.sin(time * 9 + w.seed)) * .25; continue; }
            const k = Math.min(1, w.t);
            w.g.position.lerpVectors(w.from, w.door, k);
            w.g.rotation.y = Math.atan2(-(w.door.x - w.from.x), -(w.door.z - w.from.z));
            b.position.y = Math.abs(Math.sin(time * 14 + w.seed)) * .1;
            la.rotation.z = -.2; ra.rotation.z = .2;
            la.rotation.x = Math.sin(time * 14) * .6; ra.rotation.x = -Math.sin(time * 14) * .6;
            if (w.t >= 1) { w.state = 'enter'; w.t = 0; }
          } else if (w.state === 'enter') {
            w.t += dt / .3;
            w.g.scale.setScalar(Math.max(.001, w.full * (1 - w.t)));
            if (w.t >= 1) { w.state = 'gone'; w.g.visible = false; revealRider(tr); tone(880 + Math.random() * 300, .12, 'sine', .12); }
          }
        }
        tr.riders.forEach(r => { if (r.visible && r.scale.x < 1) r.scale.setScalar(Math.min(1, r.scale.x + dt * 5)); });
      }
    }

    // ================= confetti =================
    const confGeo = new THREE.PlaneGeometry(.35, .2);
    const confetti = [];
    for (let k = 0; k < 180; k++) {
      const m = new THREE.Mesh(confGeo, new THREE.MeshBasicMaterial({ color: COLORS[k % N], side: THREE.DoubleSide }));
      m.visible = false; scene.add(m); confetti.push({ m, life: 0, v: new THREE.Vector3(), r: new THREE.Vector3() });
    }
    function burst(pos) {
      confetti.forEach(c => {
        c.life = rnd(2, 3.4); c.m.visible = true; c.m.position.copy(pos);
        c.v.set(rnd(-6, 6), rnd(7, 14), rnd(-6, 6)); c.r.set(rnd(-8, 8), rnd(-8, 8), rnd(-8, 8));
      });
    }

    // ================= sound =================
    let actx = null, muted = false, noiseBuf = null;
    function tone(freq, dur, type = 'sine', vol = .2, delay = 0, slide = 0, filter = 0) {
      if (!actx || muted) return;
      const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .04);
      g.gain.setValueAtTime(vol, t0 + dur * .7); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      let node = o;
      if (filter) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; node = o.connect(f); }
      node.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .05);
    }
    const horn = () => { for (const d of [0, .75]) { tone(311, d ? 1.0 : .55, 'sawtooth', .08, d, 0, 1400); tone(370, d ? 1.0 : .55, 'sawtooth', .07, d, 0, 1400); } };
    const ding = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .55, 'sine', .18, k * .16));
    const oops = () => { tone(330, .25, 'triangle', .2, 0, -80); tone(250, .35, 'triangle', .2, .2, -60); };
    function clack(vol) {
      if (!actx || muted) return;
      if (!noiseBuf) {
        noiseBuf = actx.createBuffer(1, actx.sampleRate * .1, actx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
      }
      for (const dl of [0, .1]) {
        const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t0 = actx.currentTime + dl;
        src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 650; g.gain.setValueAtTime(vol, t0);
        src.connect(f).connect(g).connect(actx.destination); src.start(t0);
      }
    }
    function speak(text) {
      if (muted || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = .9; u.pitch = 1.25; u.lang = 'en-US';
      speechSynthesis.speak(u);
    }
    const muteBtn = document.getElementById('mute');
    muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; if (muted && window.speechSynthesis) speechSynthesis.cancel(); };

    // ================= UI =================
    const pad = document.getElementById('pad');
    const sayEl = document.getElementById('say'), bnum = document.getElementById('bnum'), bubbleEl = document.getElementById('bubble');
    const starEl = document.getElementById('starCount');
    const buttons = [];
    for (let i = 0; i < N; i++) {
      const b = document.createElement('button');
      b.textContent = i + 1; b.style.background = COLORS[i];
      b.onclick = () => choose(i + 1);
      pad.appendChild(b); buttons.push(b);
    }
    addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '9') choose(+e.key); });
    function showBubble(text, n) {
      sayEl.textContent = text;
      bnum.textContent = n; bnum.style.background = COLORS[n - 1];
      bubbleEl.classList.remove('pop'); void bubbleEl.offsetWidth; bubbleEl.classList.add('pop');
    }

    // ================= game flow =================
    let state = 'idle', target = 0, lastTarget = 0, wrongs = 0, stars = 0, boardBounce = -1, follow = null;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const ASK = ['Take me to platform', 'Please go to platform', 'Which train goes to platform', 'Find platform'];

    function newRound() {
      do { target = 1 + Math.floor(Math.random() * N); } while (target === lastTarget);
      lastTarget = target; wrongs = 0; state = 'ask'; boardBounce = -1;
      const phrase = ASK[Math.floor(Math.random() * ASK.length)];
      showBubble(phrase, target);
      buttons.forEach(b => b.classList.remove('hint'));
      pad.classList.remove('off');
      speak(`${phrase} ${target}!`);
    }

    function choose(n) {
      if (state !== 'ask') return;
      const btn = buttons[n - 1], tr = trains[n - 1];
      if (n === target) {
        state = 'go'; pad.classList.add('off'); boardBounce = -1;
        buttons.forEach(b => b.classList.remove('hint'));
        highlight(tr.i, true); setSignal(tr.i, true);
        tr.lampMat.emissiveIntensity = 9; tr.happy = 1.4;
        showBubble('Yes! Off we go to platform', n);
        horn(); speak(`Yes! Number ${n}. All aboard!`);
        follow = tr;
        tr.anim = { from: tr.s, to: S_END, t: 0, dur: 6, delay: .8, done: () => arrive(tr) };
      } else {
        wrongs++;
        btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
        oops(); tr.wobble = .7;
        showBubble(`That's ${n}. Find`, target);
        speak(`That is ${n}. Can you find ${target}?`);
        if (wrongs >= 2) { buttons[target - 1].classList.add('hint'); boardBounce = target - 1; }
      }
    }

    function arrive(tr) {
      state = 'arrived'; stars++; starEl.textContent = stars;
      showBubble('Hooray! We reached platform', target);
      ding(); speak(`Hooray! Platform ${target}! All aboard!`);
      boardPassengers(tr);
      tr.happy = 3;
      burst(new THREE.Vector3(tr.x, 6, Z_START - tr.s));

    }
    function goHome(tr) {
      state = 'back'; boardBounce = -1;
      showBubble('Going back for the next trip…', tr.i + 1);
      tr.anim = { from: tr.s, to: S0, t: 0, dur: 4.5, delay: 0, done: () => { highlight(tr.i, false); tr.lampMat.emissiveIntensity = .8; follow = null; newRound(); } };
    }

    // tap a train or a number board in the 3D scene
    const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
    const pickables = [...boards, ...trains.flatMap(tr => tr.cars)];
    renderer.domElement.addEventListener('pointerdown', e => {
      if (state !== 'ask') return;
      ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(ptr, camera);
      const hit = ray.intersectObjects(pickables, true)[0];
      if (!hit) return;
      let o = hit.object; while (o && o.userData.idx === undefined) o = o.parent;
      if (o) choose(o.userData.idx + 1);
    });

    document.getElementById('play').onclick = () => {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      document.getElementById('start').remove();
      newRound();
    };

    // =====================================================================
    // ================= JOURNEYS: each train has its own trip ==============
    // =====================================================================
    // tileable wave normal map for the sea
    const waterNormals = canvasTex(256, 256, (c, w, h) => {
      const waves = [];
      for (let k = 0; k < 16; k++) { const kx = Math.round(rnd(-7, 7)), ky = Math.round(rnd(-7, 7)); if (kx || ky) waves.push([kx, ky, rnd(0, 6.283), 1 / Math.hypot(kx, ky)]); }
      const img = c.createImageData(w, h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let dx = 0, dy = 0;

      const dayK = sstep(-.05, .5, el), nightK = 1 - sstep(-.34, -.04, el), duskK = sstep(-.3, .12, el);
      J.nightMat.uniforms.k.value = nightK;
      J.scene.fog.color.copy(FOG_NIGHT).lerp(FOG_DUSK, duskK).lerp(J.fogDay, dayK);
      J.sun.position.copy(camera.position).addScaledVector(jv.sun, 1500); J.sun.visible = el > -.12;
      J.sunMat.color.copy(C_WARM).lerp(C_WHITE, sstep(.05, .7, el)).multiplyScalar(9);
      J.moon.position.copy(camera.position).addScaledVector(jv.moon, 1500); J.moon.visible = el < .12;
      J.stars.material.opacity = nightK;
      J.clouds.mat.color.copy(CL_NIGHT).lerp(CL_DUSK, duskK).lerp(CL_DAY, dayK);
      J.clouds.list.forEach(c => c.position.x += dt * 3);
      // ---- light follows whichever is in the sky ----
      const sunUp = el > -.04, src = sunUp ? jv.sun : jv.moon;
      const dir = jv.a.copy(src); dir.y = Math.max(dir.y, .36); dir.normalize();
      J.light.position.copy(head).addScaledVector(dir, 110); J.light.target.position.copy(head);
      if (sunUp) { J.light.intensity = 3.6 * sstep(-.04, .4, el); J.light.color.copy(C_WARM).lerp(C_WHITE, sstep(.05, .65, el)); }
      else { J.light.intensity = 2.0 * sstep(.04, .3, -el); J.light.color.copy(C_MOON); }
      J.hemi.intensity = .1 + .5 * dayK + .7 * nightK;
      J.hemi.color.set('#8fa6e8').lerp(C_WHITE, dayK);
      // headlights at night
      tr.lampMat.emissiveIntensity = 2 + nightK * 14;
      const tg0 = J.curve.getTangentAt(uE);
      J.spot.position.copy(head).addScaledVector(tg0, 2.6); J.spot.position.y = 2;
      J.spot.target.position.copy(head).addScaledVector(tg0, 26); J.spot.target.position.y = 0;
      J.spot.intensity = nightK * 900;
      if (J.water) {
        const wu = J.water.material.uniforms;
        wu.time.value += dt * .6; wu.sunDirection.value.copy(src);
        wu.sunColor.value.copy(J.light.color).multiplyScalar(Math.min(1, J.light.intensity / 3));
      }
      J.night.forEach(fn => fn(nightK));
      J.update.forEach(fn => fn(dt, time));
      // reflections & ambient light come from the sky as it changes
      jn.envT -= dt;
      if (jn.envT <= 0) {
        jn.envT = .35;
        const rt = pmrem.fromScene(J.envScene, 0, .1, 100);
        J.scene.environment = rt.texture;
        if (J.envRT) J.envRT.dispose();
        J.envRT = rt;
      }

      // ---- little narration ----
      if (!jn.saidDusk && f > .3 && el < .3) { jn.saidDusk = true; showBubble('🌇 The sun is going down…', tr.i + 1); speak('Look! The sun is going down.'); }
      if (!jn.saidNight && el < -.12) { jn.saidNight = true; showBubble('🌙 Good night! Moon and stars!', tr.i + 1); speak('Good night! Look at the moon and the stars!'); }
      if (jn.saidNight && !jn.saidMorning && f > .9 && el > 0) { jn.saidMorning = true; showBubble('☀️ Good morning, sun!', tr.i + 1); speak('Good morning! Here comes the sun!'); }
      if (f >= 1 && !jn.ending) { jn.ending = true; endJourney(); }
    }

    // ================= loop =================
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
      for (const tr of trains) {
        if (tr.anim) {
          const a = tr.anim;
          if (a.delay > 0) a.delay -= dt;
          else {
            a.t += dt / a.dur;
            const prev = tr.s;
            tr.s = a.from + (a.to - a.from) * ease(Math.min(1, a.t));
            const ds = tr.s - prev;
            tr.wheels.forEach(w => w.rotation.x -= ds / WHEEL_R);
            clackDist += Math.abs(ds); if (clackDist > 5) { clackDist = 0; clack(Math.min(.35, Math.abs(ds) / dt * .05)); }
            if (a.t >= 1) { tr.anim = null; a.done(); }
          }
        }
        tr.wobble = Math.max(0, tr.wobble - dt);
        placeTrain(tr, time, dt);
      }
      updatePassengers(dt, time);

      if (journey) updateJourney(dt, time);
      else {
        // camera: drifts gently; follows the chosen train and swings low to see its face
        let fk = 0;
        if (follow) {
          fk = clamp((follow.s - S0) / (S_END - S0), 0, 1);
          camGoal.set(follow.x * .7, 1.5, Z_START - follow.s + 3);
        } else camGoal.copy(camBase);
        camLook.lerp(camGoal, 1 - Math.pow(.3, dt));
        camDirGoal.copy(camDirBase).lerp(camDirFollow, fk).normalize();
        camDir.lerp(camDirGoal, 1 - Math.pow(.3, dt)).normalize();
        camera.position.copy(camLook).addScaledVector(camDir, camDist * (1 - .38 * fk));
        camera.position.x += Math.sin(time * .15) * 2;
        camera.lookAt(camLook);
        mainClouds.list.forEach(c => { c.position.x += dt * 2; if (c.position.x > 950) c.position.x = -950; });
      }

      confetti.forEach(c => {
        if (c.life <= 0) return;
        c.life -= dt; c.v.y -= 14 * dt; c.v.multiplyScalar(.985);
        c.m.position.addScaledVector(c.v, dt);
        c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
        if (c.life <= 0 || c.m.position.y < 0) { c.life = 0; c.m.visible = false; }
      });
      boards.forEach((b, i) => {
        const on = i === boardBounce && (state === 'arrived' || state === 'ask');
        const k = on ? Math.abs(Math.sin(time * 6)) : 0;
        b.scale.setScalar(1 + k * .18); b.position.y = BOARD_Y - .75 - k * .25;
      });

      renderPass.scene = journey ? journey.J.scene : scene;
      composer.render();
    });
  </script>
